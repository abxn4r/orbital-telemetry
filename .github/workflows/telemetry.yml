name: Orbital Telemetry Probe

on:
  schedule:
    # Runs at 06:00 UTC daily (11:30 AM IST)
    - cron: '0 6 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

jobs:
  telemetry-probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Telemetry Probe
        run: |
          python scripts/probe.py

      - name: Commit and Push Updates
        run: |
          git config --global user.name "Abeer (Orbital Canary)"
          git config --global user.email "abeerhakim77@gmail.com"
          git add README.md ARCHIVE.md
          git diff --quiet && git diff --staged --quiet || git commit -m "telemetry(probe): deep space and network scan $(date +'%Y-%m-%d')"
          git push
